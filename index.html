<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกิดแสงสว่าง — ครบเครื่อง เรื่องอุปกรณ์ไฟฟ้า</title>

  <!-- ── SEO / การแชร์ลิงก์ ── -->
  <meta name="description" content="บริษัท เกิดแสงสว่าง จำกัด จำหน่ายอุปกรณ์ไฟฟ้าครบวงจร ทั้งปลีกและส่ง — สายไฟ เบรกเกอร์ ตู้คอนซูมเมอร์ สวิตช์ เต้ารับ หลอดไฟ ท่อร้อยสายไฟ พร้อมบริการติดตั้งและปรึกษาระบบไฟฟ้า">
  <meta name="keywords" content="อุปกรณ์ไฟฟ้า, สายไฟ, เบรกเกอร์, ตู้คอนซูมเมอร์, สวิตช์ไฟฟ้า, เต้ารับ, หลอดไฟ, ท่อร้อยสายไฟ, เกิดแสงสว่าง, บางบอน">
  <meta name="author" content="บริษัท เกิดแสงสว่าง จำกัด">
  <meta name="theme-color" content="#0d5c50">
  <link rel="canonical" href="https://kirdsaengsawang.com/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="บริษัท เกิดแสงสว่าง จำกัด">
  <meta property="og:title" content="เกิดแสงสว่าง — ครบเครื่อง เรื่องอุปกรณ์ไฟฟ้า">
  <meta property="og:description" content="จำหน่ายอุปกรณ์ไฟฟ้าทั้งปลีกและส่ง ราคาเป็นมิตร ได้มาตรฐาน พร้อมผู้เชี่ยวชาญให้คำปรึกษาและบริการติดตั้ง">
  <meta property="og:image" content="assets/logo-kss.jpg">
  <meta property="og:locale" content="th_TH">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/logo-kss-trans.png">
  <link rel="apple-touch-icon" href="assets/logo-kss.jpg">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- ข้อมูลสินค้าตามแบรนด์ — สคริปต์ธรรมดา (ไม่ผ่าน Babel) เพื่อให้โหลดเร็ว -->
  <script src="brand-products.js"></script>
  <style>
    @font-face { font-family:'Mitr'; font-weight:200; font-display:swap; src:url('fonts/Mitr-ExtraLight.ttf') format('truetype'); }
    @font-face { font-family:'Mitr'; font-weight:300; font-display:swap; src:url('fonts/Mitr-Light.ttf') format('truetype'); }
    @font-face { font-family:'Mitr'; font-weight:400; font-display:swap; src:url('fonts/Mitr-Regular.ttf') format('truetype'); }
    @font-face { font-family:'Mitr'; font-weight:500; font-display:swap; src:url('fonts/Mitr-Medium.ttf') format('truetype'); }
    @font-face { font-family:'Mitr'; font-weight:600; font-display:swap; src:url('fonts/Mitr-SemiBold.ttf') format('truetype'); }
    @font-face { font-family:'Mitr'; font-weight:700; font-display:swap; src:url('fonts/Mitr-Bold.ttf') format('truetype'); }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter', 'Noto Sans Thai', Arial, sans-serif; background:#ffffff; color:#1a1a1a; min-height:100vh; }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; }
    img { display:block; max-width:100%; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#f0f0f0; }
    ::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }
    .hp-scroll-hide { scrollbar-width:none; -ms-overflow-style:none; }
    .hp-scroll-hide::-webkit-scrollbar { display:none; }

    /* ปุ่มเปิดแชทลอย — วงแหวนเรืองจางชวนสังเกต + จุดแดงกะพริบบนไอคอน + เด้งเข้ามาตอนโหลดหน้า */
    @keyframes hp-chat-pulse { 0% { transform:scale(0.92); opacity:0.55; } 70% { transform:scale(1.55); opacity:0; } 100% { transform:scale(1.55); opacity:0; } }
    @keyframes hp-chat-pop   { 0% { transform:scale(0.6) translateY(14px); opacity:0; } 60% { transform:scale(1.06) translateY(-2px); opacity:1; } 100% { transform:scale(1) translateY(0); opacity:1; } }
    @keyframes hp-chat-blink { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
    .hp-chat-launcher { animation:hp-chat-pop 0.5s cubic-bezier(.34,1.56,.64,1) both; }
    .hp-chat-launcher button { transition:transform 0.2s ease, box-shadow 0.2s ease; }
    .hp-chat-launcher button:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 16px 34px rgba(13,107,92,0.5); }
    .hp-chat-ring { position:absolute; inset:0; border-radius:999px; background:#0d9488; animation:hp-chat-pulse 2.6s ease-out infinite; pointer-events:none; }
    .hp-chat-dot { position:absolute; top:-2px; right:-2px; width:8px; height:8px; border-radius:50%; background:#f5a623; border:1.5px solid #0d6b5c; animation:hp-chat-blink 1.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .hp-chat-launcher, .hp-chat-ring, .hp-chat-dot { animation:none !important; }
    }

    /* แบนเนอร์วิดีโอหน้าแรก — 16/4 เตี้ยเกินไปบนจอแคบ ข้อความหัวเรื่องเลยล้นออกนอกกรอบด้านบน
       ขยายให้สูงขึ้นตามความกว้างจอแคบลง พร้อมย่อ padding/ฟอนต์ให้พอดีกรอบใหม่ */
    @media (max-width: 900px) {
      .hp-hero-video { aspect-ratio:16/6 !important; }
    }
    @media (max-width: 600px) {
      .hp-hero-video      { aspect-ratio:4/3 !important; }
      .hp-hero-video-text { left:20px !important; right:20px !important; bottom:22px !important; }
      .hp-hero-headline   { font-size:19px !important; margin-bottom:6px !important; }
      .hp-hero-sub        { font-size:12.5px !important; }
    }

    @keyframes hp-marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
    .hp-brand-track { animation:hp-marquee 26s linear infinite; }
    .hp-brand-track:hover { animation-play-state:paused; }
    /* โลโก้แบรนด์ขนาดใหญ่บนเดสก์ท็อป — จอมือถือย่อลงไม่ให้กินพื้นที่จนเกินไป */
    @media (max-width: 700px) {
      .hp-brand-track { gap:44px !important; }
      .hp-brand-item  { height:104px !important; width:190px !important; }
      .hp-brand-item img { max-height:96px !important; max-width:190px !important; }
    }

    @keyframes hp-pageflip { from { opacity:0; transform:rotateY(8deg) translateX(14px); } to { opacity:1; transform:rotateY(0) translateX(0); } }
    .hp-page-flip { animation:hp-pageflip 0.35s ease-out both; transform-origin:left center; }

    @keyframes tb-glow   { 0%,100% { transform:scale(1) translate(0,0); opacity:0.22; } 50% { transform:scale(1.25) translate(-20px,20px); opacity:0.4; } }
    @keyframes tb-float  { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
    @keyframes tb-badge  { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-6px) rotate(2deg); } }
    @keyframes tb-fadeup { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .tb-glow   { animation: tb-glow 7s ease-in-out infinite; }
    .tb-image  { animation: tb-float 5s ease-in-out infinite; }
    .tb-badge  { animation: tb-badge 4s ease-in-out infinite; }
    .tb-fade1  { animation: tb-fadeup 0.7s ease-out both; }
    .tb-fade2  { animation: tb-fadeup 0.7s ease-out 0.12s both; }
    .tb-fade3  { animation: tb-fadeup 0.7s ease-out 0.24s both; }

    /* ── EPIC ELECTRIC service hero ── */
    @keyframes hs-float    { 0%,100% { transform:translateY(0) rotate(-0.8deg); } 50% { transform:translateY(-16px) rotate(0.8deg); } }
    @keyframes hs-spin     { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    @keyframes hs-pulse    { 0%,100% { opacity:0.4; transform:scale(1); } 50% { opacity:0.8; transform:scale(1.18); } }
    @keyframes hs-rise     { from { opacity:0; transform:translateY(26px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes hs-shimmer  { 0% { transform:translateX(-120%) skewX(-18deg); } 60%,100% { transform:translateX(320%) skewX(-18deg); } }
    @keyframes hs-ring     { 0% { transform:scale(0.8); opacity:0.6; } 100% { transform:scale(1.7); opacity:0; } }
    @keyframes hs-sheen    { 0% { background-position:-200% center; } 100% { background-position:200% center; } }
    @keyframes hs-aurora   { 0% { transform:translate(0,0) scale(1); } 33% { transform:translate(8%,-6%) scale(1.15); } 66% { transform:translate(-6%,8%) scale(0.92); } 100% { transform:translate(0,0) scale(1); } }
    @keyframes hs-grid     { 0% { background-position:0 0; } 100% { background-position:0 44px; } }
    @keyframes hs-bordertravel { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    @keyframes hs-spark    { 0% { transform:translateY(0) scale(1); opacity:0; } 12% { opacity:1; } 80% { opacity:0.9; } 100% { transform:translateY(-180px) scale(0.4); opacity:0; } }
    @keyframes hs-neon     { 0%,100% { text-shadow:0 0 8px rgba(110,255,225,0.5), 0 0 22px rgba(34,211,180,0.35), 0 6px 26px rgba(0,0,0,0.4); } 50% { text-shadow:0 0 14px rgba(150,255,235,0.85), 0 0 38px rgba(34,211,180,0.6), 0 6px 26px rgba(0,0,0,0.4); } }
    @keyframes hs-scan     { 0% { top:-10%; opacity:0; } 8% { opacity:0.7; } 92% { opacity:0.7; } 100% { top:110%; opacity:0; } }
    .hs-float    { animation:hs-float 6s ease-in-out infinite; }
    .hs-float2   { animation:hs-float 7s ease-in-out infinite 0.8s; }
    .hs-spin     { animation:hs-spin 22s linear infinite; }
    .hs-pulse    { animation:hs-pulse 5s ease-in-out infinite; }
    .hs-rise1    { animation:hs-rise 0.75s cubic-bezier(.2,.7,.3,1) 0.05s both; }
    .hs-rise2    { animation:hs-rise 0.75s cubic-bezier(.2,.7,.3,1) 0.18s both; }
    .hs-rise3    { animation:hs-rise 0.75s cubic-bezier(.2,.7,.3,1) 0.31s both; }
    .hs-rise4    { animation:hs-rise 0.75s cubic-bezier(.2,.7,.3,1) 0.44s both; }
    .hs-ring     { animation:hs-ring 3.4s ease-out infinite; }
    .hs-aurora   { animation:hs-aurora 16s ease-in-out infinite; }
    .hs-aurora2  { animation:hs-aurora 20s ease-in-out infinite reverse; }
    .hs-cta      { position:relative; overflow:hidden; }
    .hs-cta::after { content:''; position:absolute; top:0; left:0; width:40%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation:hs-shimmer 3.4s ease-in-out infinite; }
    .hs-sheen    { background:linear-gradient(100deg,#d8fff4 0%,#ffffff 28%,#9bffe6 50%,#ffffff 72%,#d8fff4 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:hs-sheen 5s linear infinite; }
    .hs-neon     { animation:hs-neon 3s ease-in-out infinite; }
    /* perspective synthwave grid floor */
    .hs-gridfloor { position:absolute; left:-20%; right:-20%; bottom:-2px; height:55%; z-index:1; pointer-events:none;
      background-image:linear-gradient(rgba(34,211,180,0.32) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,180,0.32) 1px, transparent 1px);
      background-size:44px 44px; animation:hs-grid 1.8s linear infinite;
      transform:perspective(380px) rotateX(66deg); transform-origin:bottom center;
      -webkit-mask-image:linear-gradient(to top, #000 0%, transparent 88%); mask-image:linear-gradient(to top, #000 0%, transparent 88%); }
    /* traveling neon border ring */
    .hs-cardborder { position:absolute; inset:-1px; border-radius:22px; padding:1.5px; z-index:1; pointer-events:none;
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; overflow:hidden; }
    .hs-cardborder::before { content:''; position:absolute; top:50%; left:50%; width:220%; height:220%; transform:translate(-50%,-50%); animation:hs-bordertravel 5s linear infinite; }
    .hs-spark { position:absolute; bottom:0; width:4px; height:4px; border-radius:50%; }
    .hs-scanline { position:absolute; left:0; right:0; height:2px; z-index:2; pointer-events:none; background:linear-gradient(90deg, transparent, rgba(110,255,225,0.9), transparent); box-shadow:0 0 14px rgba(110,255,225,0.7); animation:hs-scan 6s ease-in-out infinite; }

    /* ══ รองรับจอมือถือ/แท็บเล็ต ══
       เมนูบนสุดเดิมเรียงแถวเดียวเสมอ พอจอแคบกว่าความกว้างเมนูจะดันจนเว็บเลื่อนซ้าย-ขวาได้
       จึงสลับเป็นปุ่มเมนู (☰) เมื่อจอแคบ */
    .hp-burger { display:none; }

    @media (max-width: 980px) {
      .hp-nav-desktop { display:none !important; }
      .hp-burger      { display:flex !important; }
      /* เมนูกลางถูกซ่อนแล้ว ไม่ต้องใช้กริด 3 ช่อง — กลับไปเป็นแถวเดียว
         ให้โลโก้ใช้พื้นที่ได้เต็ม แล้วดันปุ่มขวาไปสุดขอบด้วย margin-left:auto */
      .hp-header-row  { display:flex !important; }
    }
    @media (max-width: 560px) {
      .hp-brand-name  { font-size:14px !important; }
      .hp-brand-sub   { display:none !important; }
      .hp-header-row  { padding-left:12px !important; padding-right:12px !important; gap:8px !important; }
    }

    /* คอลัมน์ฟุตเตอร์ — ยุบจาก 4 คอลัมน์เหลือ 2 แล้วเหลือ 1 ตามความกว้างจอ */
    @media (max-width: 900px) { .hp-footer-grid { grid-template-columns:1fr 1fr !important; } }
    @media (max-width: 560px) { .hp-footer-grid { grid-template-columns:1fr !important; } }

    /* ตารางสินค้า — ลดจำนวนคอลัมน์ตามความกว้างจอ ไม่ให้การ์ดถูกบีบจนอ่านไม่ออก */
    @media (max-width: 1100px) { .hp-product-grid { grid-template-columns:repeat(4, 1fr) !important; } }
    @media (max-width: 860px)  { .hp-product-grid { grid-template-columns:repeat(3, 1fr) !important; } }
    @media (max-width: 620px)  { .hp-product-grid { grid-template-columns:repeat(2, 1fr) !important; } }

    /* การ์ดบทความ "บทความอื่นๆ" */
    @media (max-width: 620px) { .hp-more-grid { grid-template-columns:1fr !important; } }

    /* ช่องค้นหาในหน้าหมวดหมู่ — จอแคบให้ลงบรรทัดใหม่และกว้างเต็มแถว จะได้พิมพ์สะดวก */
    @media (max-width: 720px) {
      .hp-cat-head   { align-items:flex-start !important; }
      .hp-cat-search { width:100% !important; }
      .hp-cat-search > div:first-child { flex:1; }
      .hp-cat-search input { width:100% !important; }
    }

    /* หน้า "สินค้าตามแบรนด์" — แถบกรองแบรนด์กว้างคงที่ 250px ดันเนื้อหาล้นจอเล็ก
       จึงย้ายมาวางไว้ด้านบนแบบเต็มความกว้างแทน */
    @media (max-width: 900px) {
      .hp-brand-layout  { flex-direction:column !important; gap:18px !important; }
      .hp-brand-sidebar { width:100% !important; position:static !important; }
    }

    /* ปุ่มซูมเป็นของสำหรับเดสก์ท็อป — บนมือถือซูมด้วยนิ้วได้อยู่แล้ว
       และปุ่มนี้ไปทับกล่องแชทผู้ช่วยพอดี จึงซ่อนไปเมื่อจอแคบ */
    @media (max-width: 700px) { .hp-zoom-ctrl { display:none !important; } }

    /* ส่วน "ทำไมต้องซื้อกับเรา" — คอลัมน์รูปกว้างตายตัว 380px กว้างกว่าจอมือถือทั่วไปเอง
       (375px ก็ยังแคบกว่า) ทำให้ไปเบียดคอลัมน์ข้อความจนบีบจนดูเหมือนว่างเปล่า
       จอแคบกว่า 820px จึงสลับเป็นเรียงซ้อนแนวตั้งแทน */
    @media (max-width: 820px) {
      .hp-service-row  { flex-direction:column !important; text-align:center; gap:28px !important; padding-top:40px !important; padding-bottom:40px !important; }
      .hp-service-media{ width:100% !important; max-width:280px; }
      .hp-service-tags { justify-content:center !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

<script src="app.js"></script>
</body>
</html>
